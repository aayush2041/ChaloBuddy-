services:
  valorvault:
    build: .
    container_name: valorvault-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Persist SQLite database and customer uploaded payment receipts
      - valorvault_data:/app/server

volumes:
  valorvault_data:
